name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build APK
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: "." 
          app-name: "Холодный Рассвет"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cold-Dawn-APK
          path: apk/
