<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Холодный Рассвет</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        
        html, body {
            font-family: 'Courier New', Courier, monospace;
            background: #000; color: #fff;
            height: 100vh; width: 100vw; 
            overflow: hidden;
            margin: 0; padding: 0;
            position: fixed; top: 0; left: 0;
        }

        /* --- МЕНЮ --- */
        #mainMenu, #chapterSelect {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10;
        }
        #chapterSelect { display: none; z-index: 20; }
        
        .screen-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('img/bg_menu.jpg') center/cover no-repeat; z-index: 1;
        }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.3) 50%, rgba(50,0,0,0.5) 100%);
            z-index: 2;
        }

        /* --- ИГРА --- */
        #gameScene {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; z-index: 30; background: #000;
        }

        /* Фон ночной комнаты */
        #bedroomBg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('img/bg_night_tv.jpg') center/cover no-repeat;
            z-index: 1; transition: filter 1s, transform 1.5s;
        }

        /* Белая вспышка */
        #tvFlash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }

        /* Контейнер для видео */
        #videoContainer {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.15); 
            width: 100vw; height: 100vh; 
            background: #000; z-index: 50; 
            opacity: 0; pointer-events: none;
            transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        #videoContainer.zoomed {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1; pointer-events: auto;
        }

        /* ВИДЕО: растягиваем на весь экран */
        #videoContainer video {
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* Заполняет экран. Если нужно целиком - замени на contain */
        }

        /* Кнопка Пропустить (полупрозрачная) */
        #skipBtn {
            position: absolute; bottom: 30px; right: 30px; z-index: 60;
            padding: 10px 20px; font-size: 14px; font-family: 'Courier New', Courier, monospace;
            background: rgba(255, 0, 0, 0.4); border: 1px solid #ff0000;
            color: #fff; text-transform: uppercase; cursor: pointer;
            display: none; border-radius: 5px; backdrop-filter: blur(3px);
        }

        /* Кнопка Стоп */
        #stopBtn {
            position: absolute; top: 20px; left: 20px; z-index: 80;
            padding: 8px 15px; font-size: 14px; font-family: 'Courier New', Courier, monospace;
            background: rgba(0, 0, 0, 0.6); border: 1px solid #555;
            color: #ccc; text-transform: uppercase; cursor: pointer; display: none;
        }

        /* Экран "Спустя пару часов" */
        #timeSkip {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 60; text-align: center; opacity: 0; transition: opacity 1s;
        }
        #timeSkip h2 { color: #ff0000; font-size: 24px; letter-spacing: 2px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.7; } }

        /* Пауза */
        #pauseMenu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 200;
        }

        /* Кнопки меню */
        .menu-content {
            position: relative; z-index: 15; display: flex; flex-direction: column; align-items: center; gap: 10px;
            width: 90%; max-width: 380px;
        }
        h1 { font-size: 32px; text-transform: uppercase; color: #fff; text-shadow: 0 0 15px #ff0000; margin-bottom: 5px; text-align: center; }
        h2 { font-size: 12px; color: #ff5555; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 15px; }
        h3 { font-size: 24px; color: #fff; margin-bottom: 20px; border-bottom: 2px solid #ff0000; padding-bottom: 5px; text-transform: uppercase; }

        .btn {
            width: 100%; padding: 12px; background: rgba(15, 15, 15, 0.9);
            border: 1px solid #333; border-left: 4px solid #ff0000;
            color: #ddd; font-size: 15px; font-family: 'Courier New', Courier, monospace;
            text-align: left; text-transform: uppercase; cursor: pointer; transition: 0.2s;
        }
        .btn:active { background: rgba(255, 0, 0, 0.2); color: #fff; transform: translateX(5px); }
        .btn-center { text-align: center; border-left: 1px solid #333; border: 1px solid #ff0000; }

        #powerBtnContainer {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 10; text-align: center;
        }

        /* Плашки */
        #liveBadge {
            position: absolute; top: 30px; left: 20px; z-index: 15;
            display: flex; align-items: center; gap: 8px;
            background: rgba(0, 0, 0, 0.8); padding: 6px 12px;
            border: 1px solid #ff0000; border-radius: 3px;
            font-size: 14px; font-weight: bold; letter-spacing: 2px;
        }
        .red-dot { width: 10px; height: 10px; background: #ff0000; border-radius: 50%; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

        #dateTimer {
            position: absolute; top: 30px; right: 20px; z-index: 15;
            background: rgba(0, 0, 0, 0.8); padding: 6px 12px;
            border-right: 3px solid #ff0000; font-size: 14px; text-align: right;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="img/bg_music.mp3" type="audio/mpeg">
    </audio>

    <!-- МЕНЮ -->
    <div id="mainMenu">
        <div class="screen-bg"></div>
        <div class="overlay"></div>
        <div id="liveBadge"><div class="red-dot"></div> LIVE</div>
        <div id="dateTimer">
            <div>24.02.2022</div>
            <div style="font-size: 11px; color: #ff9999;">Четверг • 00:51</div>
        </div>
        <div class="menu-content">
            <h1>ХОЛОДНЫЙ<br>РАССВЕТ</h1>
            <h2>Политический триллер</h2>
            <button class="btn" onclick="openChapterSelect()">> Начать историю</button>
            <button class="btn" onclick="alert('Сохранений пока нет.')">> Продолжить</button>
        </div>
    </div>

    <div id="chapterSelect">
        <div class="screen-bg"></div>
        <div class="overlay"></div>
        <div class="menu-content">
            <h3>Выбор главы</h3>
            <button class="btn" onclick="startChapter(1)">> Глава первая: Под землю</button>
            <button class="btn" disabled>> Глава вторая (Скоро)</button>
            <button class="btn" style="margin-top: 20px; border-left-color: #555;" onclick="backToMain()">> Назад в меню</button>
        </div>
    </div>

    <!-- ИГРА -->
    <div id="gameScene">
        <div id="bedroomBg"></div>
        <div id="tvFlash"></div>
        
        <button id="stopBtn" onclick="openPause()">■ СТОП</button>

        <div id="powerBtnContainer">
            <button class="btn btn-center" style="width: 250px; background: rgba(0,0,0,0.8);" onclick="turnOnTV()">ВКЛЮЧИТЬ ТЕЛЕВИЗОР</button>
        </div>

        <!-- Контейнер для видео (Прямая ссылка Savedly) -->
        <div id="videoContainer">
            <video id="zelenskyVideo" playsinline crossorigin="anonymous">
                <source src="https://cdn.savedly.net/apbm8ns7.mp4" type="video/mp4">
            </video>
            <button id="skipBtn" onclick="skipVideo()">Пропустить >></button>
        </div>

        <!-- Черный экран -->
        <div id="timeSkip">
            <h2>СПУСТЯ ПАРУ ЧАСОВ...</h2>
        </div>

        <!-- Меню паузы -->
        <div id="pauseMenu">
            <h2 style="color: #fff; font-size: 20px; margin-bottom: 30px;">ПАУЗА</h2>
            <div class="menu-content" style="max-width: 250px;">
                <button class="btn btn-center" onclick="closePause()">Продолжить</button>
                <button class="btn btn-center" onclick="location.reload()">Главное меню</button>
            </div>
        </div>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        const video = document.getElementById('zelenskyVideo');
        
        window.onload = () => {
            music.volume = 0.5;
            music.play().catch(e => {
                document.body.addEventListener('touchstart', () => { music.play(); }, { once: true });
            });
        };

        function openChapterSelect() {
            music.play().catch(e=>{});
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('chapterSelect').style.display = 'flex';
        }
        
        function backToMain() {
            document.getElementById('chapterSelect').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'flex';
        }
        
        function startChapter(num) {
            if (num === 1) {
                // ВЫКЛЮЧАЕМ МУЗЫКУ
                music.pause();
                music.currentTime = 0;
                
                document.getElementById('chapterSelect').style.display = 'none';
                document.getElementById('gameScene').style.display = 'block';
            }
        }

        // --- СЦЕНАРИЙ ---
        function turnOnTV() {
            document.getElementById('powerBtnContainer').style.display = 'none';
            
            document.getElementById('bedroomBg').style.transform = 'scale(1.05)';
            
            let flash = document.getElementById('tvFlash');
            flash.style.opacity = '1';
            
            setTimeout(() => {
                flash.style.opacity = '0';
                
                let container = document.getElementById('videoContainer');
                container.style.display = 'flex';
                
                // Запускаем видео
                video.currentTime = 0;
                video.play().catch(e => {
                    console.log("Ошибка:", e);
                });
                
                setTimeout(() => { container.style.opacity = '1'; }, 100);

                // ЗУМ ЧЕРЕЗ 3 СЕКУНДЫ
                setTimeout(() => {
                    container.classList.add('zoomed');
                    setTimeout(() => { document.getElementById('skipBtn').style.display = 'block'; }, 1000);
                }, 3000);

                // Конец видео
                video.onended = () => { skipVideo(); };

            }, 300);
        }

        function skipVideo() {
            video.pause();
            video.currentTime = 0;
            
            let container = document.getElementById('videoContainer');
            container.classList.remove('zoomed');
            setTimeout(() => { container.style.display = 'none'; }, 500);

            document.getElementById('skipBtn').style.display = 'none';

            let skipScreen = document.getElementById('timeSkip');
            skipScreen.style.display = 'flex';
            setTimeout(() => { skipScreen.style.opacity = '1'; }, 50);
            
            // Включаем кнопку Стоп обратно (на будущее)
            document.getElementById('stopBtn').style.display = 'block';
        }

        // --- ПАУЗА ---
        function openPause() {
            document.getElementById('pauseMenu').style.display = 'flex';
            video.pause(); 
        }
        
        function closePause() {
            document.getElementById('pauseMenu').style.display = 'none';
            if(document.getElementById('videoContainer').style.display === 'flex') {
                video.play(); 
            }
        }
    </script>
</body>
</html>
